name: Daily job digest

# 9:00 AM IST = 3:30 AM UTC
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to save seen.json back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 fetch_jobs.py

      - name: Save state (so tomorrow only shows NEW jobs)
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen.json digest.md jobs.csv
          # applications.json only exists after you use the tracker — don't fail if missing
          [ -f applications.json ] && git add applications.json || true
          git diff --quiet --cached || git commit -m "daily digest $(date -u +%F)"
          git push
